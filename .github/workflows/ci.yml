name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer

jobs:
  quality:
    name: Swift code quality
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: swift --version
      - name: Swift formatting and lint
        run: swift format lint --strict --recursive Sources Tests Package.swift
      - name: Update feed publication tests
        run: /usr/bin/python3 scripts/test-publish-appcast.py
      - name: Shell and property list validation
        run: |
          bash -n scripts/build-app.sh
          plutil -lint Resources/Info.plist
      - name: Compile with warnings as errors
        run: swift build -Xswiftc -warnings-as-errors

  tests:
    name: Tests and app bundle
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tests with coverage
        run: swift test --enable-code-coverage -Xswiftc -warnings-as-errors
      - name: OpenCode plugin contract
        run: node scripts/test-opencode-plugin.mjs
      - name: Native notification presentation
        run: scripts/check-notifications.sh
      - name: Package development app
        run: scripts/build-app.sh
      - name: Launch packaged app without build resources
        run: scripts/check-packaged-app.sh
      - name: Verify app bundle
        run: |
          codesign --verify --deep --strict dist/Arta.app
          test -x dist/Arta.app/Contents/MacOS/CompanionApp
          test -x dist/Arta.app/Contents/MacOS/CompanionHook
          test -d dist/Arta.app/Contents/Frameworks/Sparkle.framework
          test -f dist/Arta.app/Contents/Resources/Pet/sprites.png
          ditto -c -k --sequesterRsrc --keepParent dist/Arta.app dist/Arta.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Arta-macOS-development
          path: dist/Arta.zip
          if-no-files-found: error
          retention-days: 14
